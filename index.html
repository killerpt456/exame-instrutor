<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Exame Instrutor — Preparação para o exame</title>
<meta name="description" content="Estuda e simula o exame do curso de instrutor de condução: Segurança Rodoviária, Psicologia, Pedagogia, Direito Rodoviário e Mecânica.">
<meta name="theme-color" content="#07130e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/svg+xml" href="assets/icon.svg">
</head>
<body>
<section class="auth-screen" id="auth-screen" aria-labelledby="auth-title">
  <div class="auth-panel">
    <div class="auth-mark">I</div>
    <p class="auth-kicker">Área reservada</p>
    <h1 id="auth-title">Exame Instrutor</h1>
    <p class="auth-subtitle">Introduz as tuas credenciais para continuar.</p>
    <form id="login-form" novalidate>
      <label for="login-user">Utilizador</label>
      <input id="login-user" name="username" type="text" autocomplete="username" required>
      <label for="login-password" class="password-label">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg>
        Password
      </label>
      <div class="password-field">
        <input id="login-password" name="password" type="password" autocomplete="current-password" required>
        <button class="password-toggle" id="password-toggle" type="button" aria-label="Mostrar password" aria-pressed="false">
          <svg class="eye-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg>
          <svg class="eye-off-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="m3 3 18 18M10.6 6.2A10.8 10.8 0 0 1 12 6c6 0 9.5 6 9.5 6a17.7 17.7 0 0 1-3.1 3.7M6.1 6.9C3.7 8.5 2.5 12 2.5 12s3.5 6 9.5 6a10.7 10.7 0 0 0 3.2-.5"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
        </button>
      </div>
      <p class="auth-error" id="auth-error" role="alert" hidden>Utilizador ou password inválidos.</p>
      <button class="btn btn-primary btn-block" type="submit">Entrar</button>
    </form>
  </div>
</section>
<div id="app">

  <header class="topbar">
    <div class="mark">I</div>
    <div class="title">Exame Instrutor<small>Preparação para o curso</small></div>
    <button class="logout-btn" id="logout-btn" type="button" title="Terminar sessão">Sair</button>
  </header>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-tab="inicio">
      <svg viewBox="0 0 24 24"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9h12v-9"/></svg>
      Início
    </button>
    <button class="nav-btn" data-tab="exame">
      <svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
      Exame
    </button>
    <button class="nav-btn" data-tab="estudar">
      <svg viewBox="0 0 24 24"><path d="M4 19.5V6a2 2 0 0 1 2-2h13v14H6a2 2 0 0 0-2 2Zm0 0a2 2 0 0 0 2 2h13"/></svg>
      Estudar
    </button>
    <button class="nav-btn" data-tab="revisao">
      <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      Revisão
    </button>
    <button class="nav-btn" data-tab="stats">
      <svg viewBox="0 0 24 24"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>
      Stats
    </button>
  </nav>

  <main class="view-wrap" id="view-root"></main>

</div>

<script src="data/questions.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
<script>
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
  }
</script>
</body>
</html>
